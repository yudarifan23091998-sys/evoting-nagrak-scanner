
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

  <title>Scanner QR - E-Voting Nagrak</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .header {
      flex-shrink: 0;
      text-align: center;
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      background: #172554;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: .4px;
    }

    .header p {
      margin: 5px 0 0;
      color: #cbd5e1;
      font-size: 12px;
      line-height: 1.4;
    }

    .scanner-area {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      gap: 12px;
    }

    #reader {
      width: 100%;
      height: 100%;
      max-width: 900px;
      min-height: 0;
      overflow: hidden;
      border: 0;
      border-radius: 14px;
      background: #020617;
    }

    #reader video {
      object-fit: cover !important;
    }

    #reader img {
      display: none;
    }

    #reader__scan_region {
      background: #020617;
    }

    #reader__dashboard {
      display: none !important;
    }

    .controls {
      width: 100%;
      max-width: 500px;
      flex-shrink: 0;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    button.hidden {
      display: none;
    }

    .status {
      width: 100%;
      margin-top: 10px;
      padding: 11px 14px;
      border-radius: 10px;
      background: rgba(255,255,255,.1);
      color: #e2e8f0;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .footer {
      flex-shrink: 0;
      padding: 9px 10px;
      padding-bottom: max(9px, env(safe-area-inset-bottom));
      text-align: center;
      color: #94a3b8;
      font-size: 11px;
      background: #172554;
    }

    @media (orientation: landscape) {
      .header {
        padding: 7px 12px;
      }

      .header h1 {
        font-size: 17px;
      }

      .header p {
        margin-top: 2px;
        font-size: 11px;
      }

      .scanner-area {
        padding: 6px 12px;
        gap: 6px;
      }

      .controls {
        max-width: 420px;
      }

      button {
        padding: 11px;
      }

      .status {
        margin-top: 6px;
        padding: 7px;
      }

      .footer {
        padding: 5px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>SCANNER QR E-VOTING</h1>
    <p>Panitia Pilkades Desa Nagrak — Kecamatan Ciater</p>
  </header>

  <main class="scanner-area">
    <div id="reader"></div>

    <div class="controls">
      <button id="startButton" onclick="startScanner()">
        AKTIFKAN KAMERA BELAKANG
      </button>

      <div id="status" class="status">
        Kamera belum diaktifkan.
      </div>
    </div>
  </main>

  <footer class="footer">
    E-Voting Pilkades Nagrak — Mode Simulasi
  </footer>

  <script>

    // URL WEB APP GOOGLE APPS SCRIPT
    const VOTING_URL =
      'https://script.google.com/macros/s/AKfycbxJkVsTG1ZdFtl_R3PtjfEocsyaF0ZPeSffQpClcl7Wy9-MlkQjolvFgIJr3oST7yms/exec';

    let scanner = null;
    let scannerRunning = false;
    let processing = false;

    const statusBox = document.getElementById('status');
    const startButton = document.getElementById('startButton');


    // MEMULAI KAMERA
    async function startScanner() {

      if (scannerRunning || processing) return;

      startButton.disabled = true;

      statusBox.textContent = 'Memeriksa akses kamera...';

      try {

        if (!window.isSecureContext) {
          throw new Error('Halaman harus dibuka melalui HTTPS.');
        }

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
          throw new Error('Browser tidak mendukung akses kamera.');
        }

        if (!window.Html5Qrcode) {
          throw new Error('Library scanner gagal dimuat. Periksa koneksi internet.');
        }

        scanner = new Html5Qrcode('reader');

        statusBox.textContent =
          'Meminta izin kamera belakang iPad...';

        await scanner.start(
          { facingMode: 'environment' },
          {
            fps: 10,
            qrbox: function(width, height) {
              const size = Math.floor(
                Math.min(width, height) * 0.7
              );

              return {
                width: Math.min(size, 280),
                height: Math.min(size, 280)
              };
            },
            aspectRatio: 1
          },
          onScanSuccess,
          function() {}
        );

        scannerRunning = true;

        statusBox.textContent =
          'Kamera aktif. Arahkan ke QR Code pemilih.';

        startButton.classList.add('hidden');

      } catch (error) {

        console.error('Scanner error:', error);

        statusBox.textContent =
          'Gagal mengaktifkan kamera: ' +
          (error.message || error.name || String(error));

        startButton.disabled = false;

        if (scanner) {
          try {
            await scanner.clear();
          } catch (e) {
            console.log(e);
          }
        }

        scanner = null;
        scannerRunning = false;
      }
    }


    // QR BERHASIL DIBACA
    async function onScanSuccess(decodedText) {

      if (processing) return;

      processing = true;

      const token = String(decodedText || '').trim();

      if (!token) {
        processing = false;
        return;
      }

      statusBox.textContent =
        'QR berhasil dibaca. Membuka halaman voting...';

      try {

        if (scanner && scannerRunning) {
          await scanner.stop();
          scannerRunning = false;
        }

        if (scanner) {
          await scanner.clear();
          scanner = null;
        }

        const destination =
          VOTING_URL +
          '?page=voting&token=' +
          encodeURIComponent(token);

        window.location.assign(destination);

      } catch (error) {

        console.error(error);

        statusBox.textContent =
          'Gagal memproses QR: ' +
          (error.message || String(error));

        processing = false;
        startButton.disabled = false;
      }
    }

  </script>

</body>
</html>
